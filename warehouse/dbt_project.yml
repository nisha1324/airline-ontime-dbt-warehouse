name: airline_ontime
version: "0.1.0"
config-version: 2
profile: airline_ontime

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target"]

vars:
  # Relative to this folder; run dbt from warehouse/ (scripts/build.py does).
  otp_snapshot: "../data/snapshots/otp_time_series_web.csv.gz"

models:
  airline_ontime:
    # Tables, not views: a view would keep the relative path to the CSV, so the
    # .duckdb file would only work when opened from this folder. As tables it
    # is self-contained and any client (Python, DBeaver, Power BI) can read it.
    # The marts are small (<100k rows), so tables cost nothing here either.
    +materialized: table

seeds:
  airline_ontime:
    airline_names:
      +column_types:
        reported_name: varchar
        airline_name: varchar
        cleaning_note: varchar
    airline_brands:
      +column_types:
        airline_name: varchar
        brand_family: varchar
        lineage_note: varchar
        lineage_source: varchar
    ports:
      +column_types:
        port_name: varchar
        iata_code: varchar
        state: varchar
        is_capital_city: boolean
