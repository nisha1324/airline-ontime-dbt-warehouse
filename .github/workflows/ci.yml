name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      # The lock file pins the versions the committed outputs were made with,
      # so the PNG and Parquet comparisons below are byte for byte.
      - name: Install dependencies
        run: pip install -r requirements-lock.txt

      # Verifies the snapshot's SHA-256, then seeds, models and all dbt tests.
      # Structural tests fail the build; the 6 known source defects only warn.
      - name: dbt build
        run: python scripts/build.py

      - name: Summarise dbt results
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import collections, json, pathlib
          path = pathlib.Path("warehouse/target/run_results.json")
          if not path.exists():
              print("dbt wrote no run_results.json")
              raise SystemExit
          results = json.loads(path.read_text())["results"]
          counts = collections.Counter(r["status"] for r in results)
          print("### dbt build")
          print()
          print("| status | nodes |")
          print("|---|---|")
          for status, n in sorted(counts.items()):
              print(f"| {status} | {n} |")
          EOF

      # Rerun every generator from the README's "How to run" against the CI build.
      # If any committed report, chart, Parquet file or check value changes, fail.
      - name: Regenerate reports and check nothing changed
        run: |
          python scripts/profile_source.py
          python scripts/describe_schema.py
          python scripts/analyse.py
          python scripts/export_powerbi.py
          python scripts/powerbi_checks.py
          git status --porcelain
          test -z "$(git status --porcelain)" || { git diff --stat; exit 1; }

      # Rebuilds the warehouse in a temp folder and cross-checks it against staging.
      - name: pytest
        run: pytest -q
